name: Buxaria Online (testes)

# Branch do modo online (claude/buxaria-pvp): lint, testes e build a cada push. Não publica no
# GitHub Pages (o site de lá é o do jogo solo; publicar daqui trocaria o site inteiro).
on:
  push:
    branches: [claude/buxaria-pvp]
  workflow_dispatch:

concurrency:
  group: pvp-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Lint (cada problema vira uma anotação do run)
        run: |
          npx eslint . -f json -o eslint.json || true
          node -e "const r=require('./eslint.json');let e=0;for(const f of r)for(const m of f.messages){if(m.severity===2)e++;console.log('::'+(m.severity===2?'error':'warning')+' file='+f.filePath.replace(process.cwd()+'/','')+',line='+m.line+',col='+m.column+'::'+(m.ruleId||'')+' '+m.message.replace(/\r?\n/g,' '))}console.log(e+' erro(s)');process.exit(e?1:0)"
      - run: npm test
      - run: npm run build
      - name: PeerJS junto do build
        run: test -s dist/vendor/peerjs-1.5.4.min.js
